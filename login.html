<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/login.css" />
  </head>

  <body>
    <div class="contenedor-login">
      <div class="tarjeta-login">
        <img src="img/logo.svg" alt="Logo del sistema" class="logo-login" />
        <h2>Login</h2>
        <p>Inicia sesión para continuar</p>

        <form
          onsubmit="
            iniciarSesion();
            return false;
          "
        >
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com" />
          </div>

          <label id="mensaje" class="text-danger mb-3"></label>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="contrasena" placeholder="Ingresa tu contraseña" />
          </div>

          <button type="submit" class="btn btn-dark">Iniciar sesión</button>
        </form>
      </div>
    </div>

    <script src="js/utileria.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
